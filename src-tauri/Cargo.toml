[package]
name = "gwen"
version = "0.9.1"
description = "G.W.E.N.: Gestão de Wellness, Eficiência e Navegação"
authors = ["Samara Silvia Sabino (@devs_sam)"]
edition = "2021"
license-file = "../LICENSE"
publish = false

[lib]
name = "gwen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-notification = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# garante uma janela só: o link gwen:// do login com Google volta para o app já aberto
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
# atualização pelo próprio app (baixa o instalador novo assinado e reinicia)
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# abrir junto com o Windows (chave em Configurações > Sistema)
tauri-plugin-autostart = "2"

# mapeamento de apps (0.8): app em primeiro plano e tempo ocioso, só no Windows
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemInformation"] }
# apps web instalados (PWA): AppUserModelID da janela (COM) e mídia tocando (WinRT); o windows-sys não cobre.
# É a mesma versão que o Tauri já usa, então só entram as features novas.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Shell_PropertiesSystem", "Win32_Storage_EnhancedStorage", "Media_Control", "Foundation_Collections"] }
