:root{--void:#0A0A0B;--surface:#121214;--rule:#26262A;--bone:#EDEBE7;--muted:#77777F}

.item .bar span{flex:1}
canvas{width:100%;max-width:1200px;height:auto;display:block;border:1px solid var(--rule)}

  document.fonts.load('700 80px "GW Display"'), document.fonts.load('500 16px "GW Mono"'),
  document.fonts.load('400 22px "GW Body"'), wall.decode(),
]);

function logo(x, cx, cy, s, T) {
  // G geométrico com a barra de energia, igual ao ícone do app (viewBox 14..50)
  const k = s / 36, X = (v) => cx + (v - 14) * k, Y = (v) => cy + (v - 14) * k;
  x.save();
  x.fillStyle = T.logo; x.strokeStyle = T.logo; x.lineWidth = 10 * k;
  x.beginPath(); x.arc(X(32), Y(32), 13 * k, -Math.PI / 2, Math.PI / 2, true); x.stroke();
  x.fillRect(X(32), Y(14), 18 * k, 10 * k); x.fillRect(X(32), Y(40), 18 * k, 10 * k);
  x.fillRect(X(40), Y(30), 10 * k, 20 * k); x.fillRect(X(30), Y(30), 20 * k, 8 * k);
  x.fillStyle = T.charge; x.fillRect(X(30), Y(30), 13 * k, 8 * k);
  x.restore();
}

function grid(x, w, h, T) {
  x.save(); x.strokeStyle = `rgba(${T.grid},0.05)`; x.lineWidth = 1;
  for (let i = 0; i <= w; i += 40) { x.beginPath(); x.moveTo(i + .5, 0); x.lineTo(i + .5, h); x.stroke(); }
  for (let j = 0; j <= h; j += 40) { x.beginPath(); x.moveTo(0, j + .5); x.lineTo(w, j + .5); x.stroke(); }
  x.restore();
}

function wallpaper(x, left, w, h, T) {
  // recorte do wallpaper à direita, com degradê para o fundo
  const iw = wall.naturalWidth, ih = wall.naturalHeight, sw = iw, sh = sw * (h / w);
  const sy = (ih - sh) * 0.42;
  x.save();
  if (T.invert) x.filter = "invert(1)";
  x.drawImage(wall, 0, sy, sw, sh, left, 0, w, h);
  x.restore();
  const g = x.createLinearGradient(left, 0, left + w * 0.55, 0);
  g.addColorStop(0, T.void); g.addColorStop(1, T.void + "00");
  x.fillStyle = g; x.fillRect(left, 0, w * 0.55, h);
}

function draw(c, p, T, scale) {
  const h = p.footer ? FOOT_H : H;
  c.width = W * scale; c.height = h * scale;
  const x = c.getContext("2d"); x.setTransform(scale, 0, 0, scale, 0, 0);
  x.fillStyle = T.void; x.fillRect(0, 0, W, h);
  grid(x, W, h, T);
  if (p.footer) {
    wallpaper(x, W - 520, 520, h, T);
    logo(x, 72, 36, 48, T);
    x.fillStyle = T.bone; x.font = '700 22px "GW Display"'; x.fillText("G.W.E.N.", 136, 68);
    x.fillStyle = T.muted; x.font = '400 15px "GW Mono"'; x.fillText(p.text, 300, 67);
    x.fillStyle = T.rule; x.fillRect(0, 0, W, 1);
    return;
  }
  wallpaper(x, W - 640, 640, h, T);
  // selo do código
  x.font = '500 15px "GW Mono"';
  const chip = `$ gwen · docs · ${p.code}`;
  const cw = x.measureText(chip).width + 28;
  x.strokeStyle = T.rule; x.lineWidth = 1; x.strokeRect(80.5, 72.5, cw, 34);
  x.fillStyle = T.muted; x.fillText(chip, 94, 95);
  // título em duas cores; encolhe para não invadir o wallpaper e quebra em duas linhas se precisar
  const MAX_W = W - 640 - 120;
  let size = 76;
  const fullWidth = () => { x.font = `700 ${size}px "GW Display"`; return x.measureText(p.t1 + " " + p.t2).width; };
  while (fullWidth() > MAX_W && size > 58) size -= 2;
  const twoLines = fullWidth() > MAX_W;
  let subY = 262, signY = 300;
  if (!twoLines) {
    x.fillStyle = T.bone; x.fillText(p.t1, 78, 210);
    const w1 = x.measureText(p.t1 + " ").width;
    x.fillStyle = T.muted; x.fillText(p.t2, 78 + w1, 210);
  } else {
    size = 58; x.font = `700 ${size}px "GW Display"`;
    x.fillStyle = T.bone; x.fillText(p.t1, 78, 176);
    x.fillStyle = T.muted; x.fillText(p.t2, 78, 238);
    subY = 282; signY = 316;
  }
  // subtítulo
  x.fillStyle = T.muted; x.font = '400 22px "GW Body"'; x.fillText(p.sub, 80, subY);
  // assinatura
  logo(x, 80, signY, 36, T);
  x.fillStyle = T.bone; x.font = '700 16px "GW Display"'; x.fillText("G.W.E.N.", 128, signY + 24);
  x.fillStyle = T.muted; x.font = '400 13px "GW Mono"'; x.fillText("Gestão de Wellness, Eficiência e Navegação", 218, signY + 24);
  x.fillStyle = T.rule; x.fillRect(0, h - 1, W, 1);
}

function render() {
  const T = THEMES[document.getElementById("theme").value];
  const scale = Number(document.getElementById("scale").value);
  const list = document.getElementById("list"); list.innerHTML = "";
  for (const p of PRESETS) {
    const item = document.createElement("section"); item.className = "item";
    const name = p.file + (T.invert ? "-claro" : "") + ".png";
    item.innerHTML = `<div class="bar"><span>${name}</span><button type="button">Baixar</button></div>`;
    const c = document.createElement("canvas"); c.dataset.name = name; item.appendChild(c);
    draw(c, p, T, scale);
    item.querySelector("button").onclick = () => download(c);
    list.appendChild(item);
  }
}
function download(c) { const a = document.createElement("a"); a.download = c.dataset.name; a.href = c.toDataURL("image/png"); a.click(); }
document.getElementById("theme").onchange = render;
document.getElementById("scale").onchange = render;
document.getElementById("all").onclick = () => document.querySelectorAll("canvas").forEach((c, i) => setTimeout(() => download(c), i * 250));
ready.then(render);
</script>
</body>
</html>
